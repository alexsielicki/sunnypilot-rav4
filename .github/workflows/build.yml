name: Build rav4-prebuilt

# Rebuilds the rav4-prebuilt branch (the one the car installs) whenever sunnypilot publishes a new tn-prebuilt
# build or the patches here change. If a patch no longer applies, the run fails and the branch is left as it was.

on:
  schedule:
    - cron: "43 */6 * * *"   # every 6 hours; GitHub may start scheduled runs late
  push:
    branches: [main]
    paths: ["patches/**", "scripts/build.sh"]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing changed"
        type: boolean
        default: false
      dry_run:
        description: "Build and check, but don't push"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: bash scripts/build.sh
